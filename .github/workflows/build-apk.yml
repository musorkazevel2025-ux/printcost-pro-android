name: Build PrintCost Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android project
        run: |
          echo '' | base64 --decode | tar -xz

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PrintCost-Pro-v0.1.71.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrintCost-Pro-v0.1.71-APK
          path: PrintCost-Pro-v0.1.71.apk
          if-no-files-found: error
          retention-days: 30
