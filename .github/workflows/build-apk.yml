name: Build PrintCost Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android project
        run: |
          echo '' | base64 --decode | tar -xz
      - name: Install new 3D icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          echo '' | base64 --decode > app/src/main/res/drawable-nodpi/app_icon_3d.webp
          sed -i 's|@drawable/app_icon|@drawable/app_icon_3d|' app/src/main/AndroidManifest.xml
          sed -i 's/versionCode = 1/versionCode = 2/' app/build.gradle.kts
          sed -i 's/versionName = "0.1.71"/versionName = "0.1.72"/' app/build.gradle.kts
      -       - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Restore signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - name: Sign APK
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias "${{ secrets.KEYALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTOREPASS }}" \
            --key-pass "pass:${{ secrets.KEYPASS }}" \
            --out PrintCost-Pro-v0.1.72.apk \
            app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs PrintCost-Pro-v0.1.72.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrintCost-Pro-v0.1.72-APK
          path: PrintCost-Pro-v0.1.72.apk
          if-no-files-found: error
          retention-days: 30
