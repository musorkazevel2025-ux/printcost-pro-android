name: Build 3D Print Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android project
        run: |
          echo '' | base64 --decode | tar -xz

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Restore signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - name: Sign APK
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias "${{ secrets.KEYALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTOREPASS }}" \
            --key-pass "pass:${{ secrets.KEYPASS }}" \
            --out 3D-Print-Calculator-v0.1.75.apk \
            app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs 3D-Print-Calculator-v0.1.75.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 3D-Print-Calculator-v0.1.75-APK
          path: 3D-Print-Calculator-v0.1.75.apk
          if-no-files-found: error
          retention-days: 30

