name: Build PrintCost Pro v0.1.86 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk-1.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: github.event_name != 'schedule'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'
        with:
          gradle-version: "8.10.2"

      - name: Refresh live Amazon filament data
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          mkdir -p scripts deals
          echo '' | base64 --decode > scripts/refresh_deals.py
          python scripts/refresh_deals.py
          if git diff --quiet -- deals/deals.json; then
            echo "Deals unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add deals/deals.json
            git commit -m "Refresh live Amazon filament deals"
            git push
          fi

      - name: Create Android project
        if: github.event_name != 'schedule'
        run: |
          echo '' | base64 --decode | tar -xz

      - name: Build APK
        if: github.event_name != 'schedule'
        run: gradle :app:assembleRelease --stacktrace

      - name: Restore signing key
        if: github.event_name != 'schedule'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - name: Sign APK
        if: github.event_name != 'schedule'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias "${{ secrets.KEYALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTOREPASS }}" \
            --key-pass "pass:${{ secrets.KEYPASS }}" \
            --out PrintCost-Pro-v0.1.86.apk \
            app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs PrintCost-Pro-v0.1.86.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: PrintCost-Pro-v0.1.86-APK
          path: PrintCost-Pro-v0.1.86.apk
          if-no-files-found: error
          retention-days: 30
